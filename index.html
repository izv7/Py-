<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>PySpace — Python Editor</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.css">
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#17191e;--panel2:#1e2128;--line:#2b2f38;--text:#e8eaf0;--muted:#9299a8;--green:#8be28b;--green2:#69c979;--red:#ff8585}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
    button{font:inherit;cursor:pointer}
    .topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;background:#121317}
    .menu-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:20px}
    .brand{font-weight:750;letter-spacing:.2px;font-size:17px}.brand span{color:var(--green)}
    .top-spacer{flex:1}.status{color:var(--muted);font-size:12px}
    .run-btn{border:0;border-radius:9px;background:var(--green);color:#102015;padding:9px 19px;font-weight:750;min-width:94px}
    .run-btn:hover{background:#a5efa5}.run-btn:disabled{opacity:.55;cursor:wait}
    main{height:calc(100vh - 62px);display:flex;flex-direction:column;padding:18px 20px 20px;gap:12px}
    .workspace{flex:1;min-height:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#17191e;display:flex;flex-direction:column}
    .editor-head{height:43px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .editor-wrap{flex:1;min-height:0}
    .CodeMirror{height:100%;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;padding:12px 0;background:#17191e}
    .CodeMirror-gutters{background:#17191e;border-right:1px solid #292d35}
    .CodeMirror-linenumber{color:#626b7b;padding:0 12px 0 8px}
    .CodeMirror-cursor{border-left:2px solid #dce4ed}
    .output{height:185px;min-height:125px;border:1px solid var(--line);border-radius:13px;background:#14161a;display:flex;flex-direction:column;overflow:hidden}
    .output-head{height:42px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);gap:8px}
    .output-title{font-weight:650}.output-label{color:var(--muted);font-size:12px;margin-left:auto}
    #output{margin:0;padding:12px 15px;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#cbd5e1;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;flex:1}
    #output.error{color:var(--red)}
    .drawer-backdrop{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s;z-index:4}
    .drawer{position:fixed;z-index:5;left:0;top:0;bottom:0;width:min(320px,88vw);background:#17191e;border-right:1px solid var(--line);transform:translateX(-102%);transition:.22s;display:flex;flex-direction:column;padding:18px}
    body.drawer-open .drawer{transform:translateX(0)}body.drawer-open .drawer-backdrop{opacity:1;pointer-events:auto}
    .drawer-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .drawer-title{font-size:16px;font-weight:750}.close-btn{border:0;background:transparent;color:var(--muted);font-size:22px}
    .new-btn{width:100%;padding:11px;border:1px solid #3a4b3d;border-radius:9px;background:#1d2a21;color:var(--green);font-weight:700;text-align:left}
    .section-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:24px 0 9px}
    #session-list{overflow:auto;display:flex;flex-direction:column;gap:5px}
    .session-item{padding:10px 11px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .session-item:hover,.session-item.active{background:var(--panel2);border-color:var(--line)}
    .empty{color:var(--muted);font-size:12px;padding:10px 2px}
    .drawer-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    @media(max-width:650px){main{padding:12px;gap:10px}.topbar{padding:0 12px}.output{height:165px}.status{display:none}.CodeMirror{font-size:13px}}
  </style>
</head>
<body>
  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="drawer" aria-label="Code sessions">
    <div class="drawer-top"><div class="drawer-title">Your workspace</div><button class="close-btn" id="close-menu" aria-label="Close menu">×</button></div>
    <button class="new-btn" id="new-session">＋ &nbsp; New session</button>
    <div class="section-label">Recent code</div>
    <div id="session-list"></div>
    <div class="drawer-foot">Saved automatically in this browser.</div>
  </aside>

  <header class="topbar">
    <button class="menu-btn" id="menu-btn" aria-label="Open menu">☰</button>
    <div class="brand">Py<span>Space</span></div>
    <div class="top-spacer"></div>
    <div class="status" id="status">Ready</div>
    <button class="run-btn" id="run-btn">▶ Run</button>
  </header>

  <main>
    <section class="workspace">
      <div class="editor-head"><span class="dot"></span><span id="file-title">main.py</span><span style="margin-left:auto">Python</span></div>
      <div class="editor-wrap"><textarea id="code"># Welcome to PySpace
# Write Python code here, then press Run.

name = "Python"
print(f"Hello, {name}!")</textarea></div>
    </section>
    <section class="output">
      <div class="output-head"><span class="output-title">Output</span><span class="output-label" id="runtime-status">Python runtime loads on first run</span></div>
      <pre id="output">Your output will appear here.</pre>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pyodide@0.27.7/pyodide.js"></script>
  <script>
    const DB_NAME = "pyspace-db", STORE = "sessions";
    let db, currentId, pyodide, runtimePromise;
    const starterCode = '# Welcome to PySpace\\n# Write Python code here, then press Run.\\n\\nname = "Python"\\nprint(f"Hello, {name}!")';
    const editor = CodeMirror.fromTextArea(document.getElementById("code"), {
      mode:"python", theme:"material-darker", lineNumbers:true, indentUnit:4,
      tabSize:4, lineWrapping:true, autofocus:true
    });
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const runtimeStatus = document.getElementById("runtime-status");
    const runButton = document.getElementById("run-btn");

    function openDB(){
      return new Promise((resolve,reject)=>{
        const req=indexedDB.open(DB_NAME,1);
        req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:"id"});
        req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
      });
    }
    function allSessions(){
      return new Promise((resolve,reject)=>{
        const req=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
        req.onsuccess=()=>resolve(req.result.sort((a,b)=>b.updated-a.updated)); req.onerror=()=>reject(req.error);
      });
    }
    function saveSession(){
      if(!db||!currentId)return;
      const record={id:currentId,code:editor.getValue(),updated:Date.now()};
      const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(record);
      tx.oncomplete=renderSessions;
    }
    function getSession(id){
      return new Promise((resolve,reject)=>{
        const req=db.transaction(STORE,"readonly").objectStore(STORE).get(id);
        req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
      });
    }
    function makeId(){return "s-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)}
    function titleFor(code){const line=code.split("\\n").map(x=>x.trim()).find(x=>x&&!x.startsWith("#"));return (line||"Untitled session").slice(0,34)}
    async function renderSessions(){
      const list=document.getElementById("session-list");list.innerHTML="";
      const sessions=await allSessions();
      if(!sessions.length){list.innerHTML='<div class="empty">No saved code yet.</div>';return}
      sessions.forEach(s=>{
        const btn=document.createElement("button");btn.className="session-item"+(s.id===currentId?" active":"");
        btn.textContent=titleFor(s.code);btn.title=new Date(s.updated).toLocaleString();
        btn.onclick=()=>loadSession(s.id);list.appendChild(btn);
      });
    }
    async function loadSession(id){
      const s=await getSession(id);if(!s)return;
      currentId=id;editor.setValue(s.code);output.textContent="Session opened.";output.classList.remove("error");
      document.getElementById("file-title").textContent=titleFor(s.code)+".py";
      closeDrawer();renderSessions();status.textContent="Saved";
    }
    async function newSession(){
      saveSession();currentId=makeId();editor.setValue(starterCode);
      document.getElementById("file-title").textContent="main.py";
      output.textContent="Your output will appear here.";output.classList.remove("error");
      await saveSession();closeDrawer();editor.focus();renderSessions();
    }
    let saveTimer;
    editor.on("change",()=>{
      status.textContent="Saving…";clearTimeout(saveTimer);
      saveTimer=setTimeout(()=>{saveSession();status.textContent="Saved";},350);
      document.getElementById("file-title").textContent=titleFor(editor.getValue())+".py";
    });
    function openDrawer(){document.body.classList.add("drawer-open");renderSessions()}
    function closeDrawer(){document.body.classList.remove("drawer-open")}
    document.getElementById("menu-btn").onclick=openDrawer;
    document.getElementById("close-menu").onclick=closeDrawer;
    document.getElementById("backdrop").onclick=closeDrawer;
    document.getElementById("new-session").onclick=newSession;

    async function loadRuntime(){
      if(!runtimePromise){
        runtimeStatus.textContent="Loading Python…";
        runtimePromise=loadPyodide();
      }
      pyodide=await runtimePromise;runtimeStatus.textContent="Python ready";return pyodide;
    }
    async function runCode(){
      const code=editor.getValue();saveSession();runButton.disabled=true;runButton.textContent="Running…";
      output.classList.remove("error");output.textContent="";status.textContent="Running";
      try{
        const py=await loadRuntime();
        py.setStdout({batched:s=>{output.textContent+=s+"\n"}});
        py.setStderr({batched:s=>{output.textContent+=s+"\n";output.classList.add("error")}});
        await py.runPythonAsync(code);
        if(!output.textContent)output.textContent="Code finished successfully (no output).";
        status.textContent="Finished";
      }catch(err){output.textContent=String(err);output.classList.add("error");status.textContent="Error"}
      finally{runButton.disabled=false;runButton.textContent="▶ Run"}
    }
    runButton.onclick=runCode;
    editor.setOption("extraKeys",{"Ctrl-Enter":runCode,"Cmd-Enter":runCode});

    (async()=>{
      try{
        db=await openDB();const sessions=await allSessions();
        if(sessions.length){await loadSession(sessions[0].id)}
        else{currentId=makeId();editor.setValue(starterCode);saveSession()}
        await renderSessions();
      }catch(e){status.textContent="Storage unavailable";output.textContent="Your browser could not open local storage. Try a modern browser."}
    })();
  </script>
</body>
</html>
